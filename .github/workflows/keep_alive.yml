name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 2 days at midnight UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # REPLACE the URL below with your actual deployed Streamlit app URL
          curl -sS https://analytical-trading-ai.streamlit.app/ > /dev/null
          echo "App pinged successfully!"
