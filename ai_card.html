<div class="ai-card" style="box-shadow: inset 0 2px 15px {color}; border-top: 2px solid {color};">
    <div class="ai-title">Live AI Trading Intelligence</div>
    <div class="ai-recom">
        <div class="pulse-dot" style="background-color: {color}; box-shadow: 0 0 10px {color}; animation: {animation} 2s infinite;"></div>
        {recom}
    </div>
    <div class="ai-desc">{desc}</div>
</div>
